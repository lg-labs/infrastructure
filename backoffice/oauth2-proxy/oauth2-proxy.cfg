# oauth2-proxy config — BackOffice SSO
# Modo sidecar: nginx-gateway delega auth_request a este proxy.
#
# IMPORTANTE: Keycloak está accesible vía dos hostnames:
#   - INTERNO  http://keycloak:8080         (back-channel: oauth2-proxy → Keycloak)
#   - EXTERNO  http://localhost:8083        (front-channel: navegador → Keycloak)
#
# Resolvemos esto deshabilitando OIDC discovery y declarando endpoints explícitos.
# El "login_url" lo ve el navegador (debe ir a localhost:8083). El resto los
# usa el contenedor oauth2-proxy y van por el DNS interno.

provider = "oidc"
client_id = "oauth2-proxy"
client_secret = "lgpass-oidc-secret-change-me"

# Skip discovery + endpoints explícitos por el split front/back channel
# Keycloak vive bajo /keycloak/ (--http-relative-path=/keycloak) para que
# pueda ser proxyado por nginx-gateway en /keycloak/.
skip_oidc_discovery = true
oidc_issuer_url = "http://localhost:8083/keycloak/realms/lglabs"
login_url       = "http://localhost:8083/keycloak/realms/lglabs/protocol/openid-connect/auth"
redeem_url      = "http://keycloak:8080/keycloak/realms/lglabs/protocol/openid-connect/token"
profile_url     = "http://keycloak:8080/keycloak/realms/lglabs/protocol/openid-connect/userinfo"
oidc_jwks_url   = "http://keycloak:8080/keycloak/realms/lglabs/protocol/openid-connect/certs"
insecure_oidc_allow_unverified_email = true
insecure_oidc_skip_issuer_verification = true

# Cookie / sesión
cookie_secret = "YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU="
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_domains = ["localhost"]

# HTTP server
http_address = "0.0.0.0:4180"
reverse_proxy = true
real_client_ip_header = "X-Forwarded-For"

# Claims → headers que nginx forwardea
email_domains = ["*"]
oidc_groups_claim = "groups"
set_xauthrequest = true
set_authorization_header = false
pass_user_headers = true
pass_authorization_header = false
skip_provider_button = true

# Redirección post-login
whitelist_domains = ["localhost"]
redirect_url = "http://localhost:8080/oauth2/callback"

# Permitir Authorization: Bearer <jwt> (smoke-tests automatizados)
# El JWT debe venir firmado por el mismo issuer (Keycloak realm lglabs).
# Usamos el hostname interno para que oauth2-proxy pueda hacer JWKS lookup.
# Tests deben obtener el token desde dentro de la red docker (ver smoke-tests.md).
skip_jwt_bearer_tokens = true
extra_jwt_issuers = "http://keycloak:8080/keycloak/realms/lglabs=oauth2-proxy"

# Logging — base del audit (C6)
# IMPORTANTE: oauth2-proxy quota internamente {{.RequestURI}}, así que NO la envolvemos en \"...\".
# Otros campos string (user, client_ip, ts, method, upstream, protocol) sí necesitan quotes manuales.
silence_ping_logging = true
request_logging = true
auth_logging = true
standard_logging = true
request_logging_format = "{\"ts\":\"{{.Timestamp}}\",\"client_ip\":\"{{.Client}}\",\"user\":\"{{.Username}}\",\"method\":\"{{.RequestMethod}}\",\"upstream\":\"{{.Upstream}}\",\"path\":{{.RequestURI}},\"protocol\":\"{{.Protocol}}\",\"status\":{{.StatusCode}},\"bytes\":{{.ResponseSize}},\"duration\":{{.RequestDuration}},\"audit_type\":\"request\"}"
auth_logging_format = "{\"ts\":\"{{.Timestamp}}\",\"client_ip\":\"{{.Client}}\",\"user\":\"{{.Username}}\",\"status\":\"{{.Status}}\",\"message\":\"{{.Message}}\",\"audit_type\":\"auth\"}"
standard_logging_format = "{\"ts\":\"{{.Timestamp}}\",\"file\":\"{{.File}}\",\"message\":\"{{.Message}}\",\"audit_type\":\"standard\"}"

# Logs a archivo + stdout (Filebeat tail-eará el archivo)
logging_filename = "/var/log/proxy/oauth2-proxy.log"
logging_max_size = 50
logging_max_age = 7
logging_max_backups = 3
