name: ${COMPOSE_PROJECT_NAME:-lg-infra-backoffice}

# BackOffice stack
# Fase A: andamiaje
# Fase B: Keycloak (IdP) — DONE
# Fase C: oauth2-proxy + nginx-gateway (SSO + autorización por rol) — IN PROGRESS
# Fase D: Portainer (los upstreams AKHQ/Kibana se enlazan vía networks externas)
# Fase E: pipeline audit a ELK

networks:
  lg-backoffice:
    driver: bridge
  lg-infra-kafka_default:
    external: true
  elastic:
    external: true

services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    container_name: lg-infra-backoffice-keycloak
    hostname: keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
      - --http-relative-path=/keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-lglabs}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS:-lgpass}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "${KEYCLOAK_PORT:-8083}:8080"
    volumes:
      - backoffice-keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-lglabs.json:/opt/keycloak/data/import/realm-lglabs.json:ro
    networks:
      - lg-backoffice
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KEYCLOAK_MEM_LIMIT:-768m}

  proxy-volume-init:
    image: busybox:1.37
    container_name: lg-infra-backoffice-proxy-init
    command: ["sh", "-c", "mkdir -p /var/log/proxy && chown -R 65532:65532 /var/log/proxy && echo 'audit volume ready'"]
    volumes:
      - backoffice-audit-logs:/var/log/proxy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 16m

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION:-v7.7.1}
    container_name: lg-infra-backoffice-proxy
    hostname: oauth2-proxy
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - backoffice-audit-logs:/var/log/proxy
    depends_on:
      keycloak:
        condition: service_healthy
      proxy-volume-init:
        condition: service_completed_successfully
    networks:
      - lg-backoffice
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4180/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OAUTH2_PROXY_MEM_LIMIT:-128m}

  gateway:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: lg-infra-backoffice-gateway
    hostname: gateway
    ports:
      - "${BACKOFFICE_PORT:-8080}:80"
    volumes:
      - ./home/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./home/html:/usr/share/nginx/html:ro
    depends_on:
      oauth2-proxy:
        condition: service_healthy
      portainer:
        condition: service_started
    networks:
      - lg-backoffice
      - lg-infra-kafka_default
      - elastic
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/oauth2/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HOME_MEM_LIMIT:-64m}

  kibana-init:
    # E3: idempotently provisions ILM policy, index template, and Kibana data view
    # for the BackOffice audit pipeline. Runs once and exits.
    image: curlimages/curl:8.10.1
    container_name: lg-infra-backoffice-kibana-init
    user: "0"
    entrypoint: ["sh", "/scripts/setup-audit.sh"]
    environment:
      ES_URL: https://es01:9200
      KIBANA_URL: http://kibana:5601/kibana
      ES_USER: ${ELASTIC_USER:-elastic}
      ES_PASS: ${ELASTIC_PASSWORD:-lgpass}
      CA_CERT: /certs/ca/ca.crt
    volumes:
      - ./kibana-init/setup-audit.sh:/scripts/setup-audit.sh:ro
      - lg-infra-elk_certs:/certs:ro
    networks:
      - elastic
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 32m

  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.21.4}-alpine
    container_name: lg-infra-backoffice-portainer
    hostname: portainer
    command: ["--http-enabled", "--bind=:9000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backoffice-portainer-data:/data
    networks:
      - lg-backoffice
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/api/status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${PORTAINER_MEM_LIMIT:-256m}

volumes:
  backoffice-keycloak-data:
    name: backoffice-keycloak-data
  backoffice-audit-logs:
    name: backoffice-audit-logs
  backoffice-portainer-data:
    name: backoffice-portainer-data
  lg-infra-elk_certs:
    external: true
    name: lg-infra-elk_certs
