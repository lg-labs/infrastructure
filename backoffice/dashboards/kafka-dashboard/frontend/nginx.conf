server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint usado por el healthcheck del container (no requiere auth en gateway)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Para subrutas (topics.html, schemas.html, etc.) servidas en /kafka/<file>
    location / {
        try_files $uri $uri/ =404;
    }
}
