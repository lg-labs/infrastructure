# Kafka Dashboard sub-stack (Fase A: andamiaje)
#
# Sub-compose incluido desde backoffice/docker-compose.yml via `include:`.
# NO se levanta por sí solo — siempre como parte del BackOffice.
#
# Servicios:
#   - kafka-dashboard-fe:  nginx servirá la UI estática (Alpine.js) en /kafka/
#   - kafka-dashboard-bff: FastAPI servirá la API en /kafka/api/
#
# Especificación: ../specs/design.md (§2, §10)

name: ${COMPOSE_PROJECT_NAME:-lg-infra-backoffice}

networks:
  lg-backoffice:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-lg-infra-backoffice}_lg-backoffice
  lg-infra-kafka_default:
    external: true

volumes:
  backoffice-kafka-dashboard-data:
    name: backoffice-kafka-dashboard-data
  # Volumen compartido con oauth2-proxy + filebeat (declarado en
  # backoffice/docker-compose.yml). Aquí lo declaramos como `external: true`
  # con el mismo `name:` para reutilizarlo desde este sub-compose
  # (Phase F.1: el BFF escribe kafka-dashboard-app.log para Filebeat).
  backoffice-audit-logs:
    external: true
    name: backoffice-audit-logs

services:
  kafka-dashboard-fe:
    image: nginx:1.27-alpine
    container_name: lg-infra-backoffice-kafka-dashboard-fe
    hostname: kafka-dashboard-fe
    networks:
      - lg-backoffice
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KAFKA_DASHBOARD_FE_MEM_LIMIT:-64m}

  kafka-dashboard-bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    image: lg-infra-backoffice/kafka-dashboard-bff:0.1.0
    container_name: lg-infra-backoffice-kafka-dashboard-bff
    hostname: kafka-dashboard-bff
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29092,kafka3:29092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      SQLITE_PATH: /data/kafka-dashboard.sqlite
      OWNERS_YAML_PATH: /app/config/owners.yaml
      LOG_LEVEL: ${KAFKA_DASHBOARD_LOG_LEVEL:-INFO}
    networks:
      - lg-backoffice
      - lg-infra-kafka_default
    volumes:
      - backoffice-kafka-dashboard-data:/data
      - ./bff/config:/app/config:ro
      # Phase F.1: escribir audit log al volumen compartido que filebeat tail-ea
      - backoffice-audit-logs:/var/log/backoffice
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KAFKA_DASHBOARD_BFF_MEM_LIMIT:-256m}
