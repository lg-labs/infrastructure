# BackOffice gateway — nginx
#
# Pipeline por upstream:
#   1. auth_request → oauth2-proxy /oauth2/auth (verifica autenticación)
#       - 401 → error_page 401 → @redirect_to_login
#       - 2xx → continúa
#   2. nginx setea $groups con la cabecera X-Auth-Request-Groups
#   3. error_page 403 + try_files trick para chequear grupos en fase content
#       - usamos un location @ con `if` (que aquí sí ve $groups)

worker_processes 1;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    # WebSocket upgrade map (Kibana, Portainer)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream oauth2_proxy { server oauth2-proxy:4180; }
    upstream akhq_upstream      { server akhq:8080; }
    upstream kibana_upstream    { server kibana:5601; }
    upstream portainer_upstream { server portainer:9000; }
    upstream keycloak_upstream  { server keycloak:8080; }
    upstream kafka_dashboard_fe_upstream  { server kafka-dashboard-fe:80; }
    upstream kafka_dashboard_bff_upstream { server kafka-dashboard-bff:8000; }
    upstream containers_dashboard_fe_upstream  { server containers-dashboard-fe:80; }
    upstream containers_dashboard_bff_upstream { server containers-dashboard-bff:8000; }

    # Server interno con stubs y endpoint /me
    server {
        listen 8081;
        server_name _;
        default_type text/plain;

        location = /stub/akhq      { return 200 'STUB /akhq/ — autorizado.\n'; }
        location = /stub/portainer { return 200 'STUB /portainer/ — autorizado.\n'; }
        location = /stub/kibana    { return 200 'STUB /kibana/ — autorizado.\n'; }
        location = /stub/keycloak  { return 200 'STUB /keycloak/ — solo admin.\n'; }

        location = /stub/me {
            default_type application/json;
            return 200 '{"user":"$http_x_auth_user","email":"$http_x_auth_email","groups":"$http_x_auth_groups"}';
        }
    }

    # Server público :80
    server {
        listen 80;
        server_name _;

        # ---- oauth2-proxy passthrough ----
        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Scheme                $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass       http://oauth2_proxy;
            proxy_set_header Host             $http_host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Original-URI   $request_uri;
            proxy_set_header Authorization    $http_authorization;
            proxy_pass_request_body           off;
            proxy_set_header Content-Length   "";
        }

        # ---- handlers de error globales ----
        error_page 401 = @redirect_to_login;
        location @redirect_to_login {
            return 302 $scheme://$http_host/oauth2/sign_in?rd=$scheme://$http_host$request_uri;
        }

        # ---- 403 page ----
        location @forbidden_page {
            internal;
            default_type text/html;
            return 403 '<!doctype html><html><body style="font-family:sans-serif"><h1>403 — Acceso denegado</h1><p>Tu rol no tiene acceso a este recurso.</p><p><a href="/">← Volver al BackOffice</a></p></body></html>';
        }

        # ---- landing ----
        location = / {
            auth_request /oauth2/auth;
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # ---- /me ----
        location = /me {
            auth_request     /oauth2/auth;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            proxy_set_header X-Auth-User   $user;
            proxy_set_header X-Auth-Email  $email;
            proxy_set_header X-Auth-Groups $groups;
            proxy_pass http://127.0.0.1:8081/stub/me;
        }

        # ---- upstreams protegidos ----
        # Patrón: auth_request primero (autenticación), luego try_files al
        # location @check_X que evalúa el grupo. Como try_files está en fase
        # content (post-access), $groups SÍ tiene el valor inyectado por
        # auth_request_set.

        location /akhq/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_akhq;
        }
        location @do_akhq {
            internal;
            if ($groups !~ "(^|,)(admin|operator)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            proxy_pass         http://akhq_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Auth-User       $user;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        location /portainer/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_portainer;
        }
        location @do_portainer {
            internal;
            if ($groups !~ "(^|,)(admin|operator)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            # Portainer no soporta basePath nativo: stripeamos /portainer/ y dejamos al user nav en /
            rewrite ^/portainer/(.*) /$1 break;
            proxy_pass         http://portainer_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        location /kibana/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_kibana;
        }
        location @do_kibana {
            internal;
            if ($groups !~ "(^|,)(admin|operator|support|viewer)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            proxy_pass         http://kibana_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location /keycloak/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_keycloak;
        }
        location @do_keycloak {
            internal;
            if ($groups !~ "(^|,)admin(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            # Keycloak Admin Console requiere conocer su path. Le pasamos el prefijo via Host/Forwarded
            proxy_pass         http://keycloak_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Prefix /keycloak;
        }

        # ---- Kafka Dashboard (sub-stack del BackOffice, ver dashboards/kafka-dashboard/) ----
        # /kafka/api/health: público (healthcheck del propio container, no requiere auth)
        location = /kafka/api/health {
            proxy_pass         http://kafka_dashboard_bff_upstream/api/health;
            proxy_set_header   Host              $host;
        }

        # /kafka/  → frontend estático (UI). Todos los roles autenticados pueden ver la UI.
        location /kafka/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_kafka_fe;
        }
        location @do_kafka_fe {
            internal;
            if ($groups !~ "(^|,)(admin|operator|support|viewer)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            # Servimos los assets estáticos. La UI usa rutas relativas (./api/...) para hablar con el BFF.
            rewrite ^/kafka/(.*) /$1 break;
            proxy_pass         http://kafka_dashboard_fe_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Auth-User       $user;
        }

        # /kafka/api/  → BFF FastAPI. Authz dual:
        #   - GET/HEAD: cualquier rol autenticado.
        #   - POST/PUT/PATCH/DELETE en /kafka/api/acl-metadata*: solo admin.
        #   - POST/PUT/PATCH/DELETE en el resto: admin u operator.
        # La autorización fina vive en @do_kafka_bff (fase content, $groups inyectado).
        location /kafka/api/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_kafka_bff;
        }
        location @do_kafka_bff {
            internal;
            # Authz por método + path. Sin "if" anidado (no permitido en nginx).
            # Construimos una clave concatenando 3 flags y comparamos al final.
            #   método:     read|write
            #   recurso:    acl|other
            #   rol:        admin|operator|reader|none

            set $km "write";
            if ($request_method = GET)  { set $km "read"; }
            if ($request_method = HEAD) { set $km "read"; }

            set $kr "other";
            if ($uri ~ "^/kafka/api/acl-metadata") { set $kr "acl"; }

            set $kg "none";
            if ($groups ~ "(^|,)(support|viewer)(,|$)") { set $kg "reader"; }
            if ($groups ~ "(^|,)operator(,|$)")          { set $kg "operator"; }
            if ($groups ~ "(^|,)admin(,|$)")             { set $kg "admin"; }

            set $kkey "${km}:${kr}:${kg}";

            # Lista blanca explícita (cualquier cosa fuera de aquí → 403)
            set $kallow "no";
            # Lecturas: cualquier rol autenticado
            if ($kkey = "read:other:reader")   { set $kallow "yes"; }
            if ($kkey = "read:other:operator") { set $kallow "yes"; }
            if ($kkey = "read:other:admin")    { set $kallow "yes"; }
            if ($kkey = "read:acl:reader")     { set $kallow "yes"; }
            if ($kkey = "read:acl:operator")   { set $kallow "yes"; }
            if ($kkey = "read:acl:admin")      { set $kallow "yes"; }
            # Mutaciones de topics/schemas: admin u operator
            if ($kkey = "write:other:operator") { set $kallow "yes"; }
            if ($kkey = "write:other:admin")    { set $kallow "yes"; }
            # Mutaciones de ACL-metadata: solo admin
            if ($kkey = "write:acl:admin")      { set $kallow "yes"; }

            if ($kallow != "yes") { return 403; }
            error_page 403 = @forbidden_page;

            # El BFF expone sus rutas como /api/* (no /kafka/api/*).
            # Stripeamos el prefijo /kafka antes de pasarle el request.
            rewrite ^/kafka/(.*) /$1 break;

            proxy_pass         http://kafka_dashboard_bff_upstream;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Real-IP               $remote_addr;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       $scheme;
            proxy_set_header   X-Auth-Request-User     $user;
            proxy_set_header   X-Auth-Request-Groups   $groups;
            proxy_set_header   X-Original-URI          $request_uri;
        }

        # ---- Containers Dashboard (sub-stack del BackOffice, ver dashboards/containers-dashboard/) ----
        # /containers/api/health: público (healthcheck del propio container, no requiere auth)
        location = /containers/api/health {
            proxy_pass         http://containers_dashboard_bff_upstream/api/health;
            proxy_set_header   Host              $host;
        }

        # WebSocket exec — admin only. Regex location debe ir ANTES de /containers/api/.
        # Nota: usamos `location ~ ^/containers/api/containers/[^/]+/exec` para que coincida
        # exactamente con la ruta exec y no con otras subrutas; nginx evalúa regex tras prefix.
        location ~ ^/containers/api/containers/[^/]+/exec$ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_containers_exec;
        }
        location @do_containers_exec {
            internal;
            # Solo admin (defense-in-depth: BFF también valida con require_admin).
            if ($groups !~ "(^|,)admin(,|$)") { return 403; }
            error_page 403 = @forbidden_page;

            rewrite ^/containers/(.*) /$1 break;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Auth-Request-User     $user;
            proxy_set_header   X-Auth-Request-Groups   $groups;
            proxy_set_header   X-Original-URI          $request_uri;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass         http://containers_dashboard_bff_upstream;
        }

        # /containers/  → frontend estático (SPA). Todos los roles autenticados.
        location /containers/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_containers_fe;
        }
        location @do_containers_fe {
            internal;
            if ($groups !~ "(^|,)(admin|operator|support|viewer)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            rewrite ^/containers/(.*) /$1 break;
            proxy_pass         http://containers_dashboard_fe_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Auth-User       $user;
        }

        # /containers/api/ → BFF FastAPI. Authz por método:
        #   GET/HEAD: cualquier rol autenticado.
        #   POST    : admin u operator (start/stop/restart).
        #   DELETE  : solo admin (remove).
        # WS exec se maneja en el location ~ de arriba (matchea antes).
        location /containers/api/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_containers_bff;
        }
        location @do_containers_bff {
            internal;
            # Authz por método — clave concatenada (mismo patrón kafka-dashboard).
            #   método: read|write|delete
            #   rol:    admin|operator|reader|none

            set $cm "write";
            if ($request_method = GET)    { set $cm "read"; }
            if ($request_method = HEAD)   { set $cm "read"; }
            if ($request_method = DELETE) { set $cm "delete"; }

            set $cg "none";
            if ($groups ~ "(^|,)(support|viewer)(,|$)") { set $cg "reader"; }
            if ($groups ~ "(^|,)operator(,|$)")          { set $cg "operator"; }
            if ($groups ~ "(^|,)admin(,|$)")             { set $cg "admin"; }

            set $ckey "${cm}:${cg}";

            set $callow "no";
            # Lecturas: cualquier autenticado
            if ($ckey = "read:reader")    { set $callow "yes"; }
            if ($ckey = "read:operator")  { set $callow "yes"; }
            if ($ckey = "read:admin")     { set $callow "yes"; }
            # Mutaciones reversibles (POST start/stop/restart): admin u operator
            if ($ckey = "write:operator") { set $callow "yes"; }
            if ($ckey = "write:admin")    { set $callow "yes"; }
            # DELETE: solo admin
            if ($ckey = "delete:admin")   { set $callow "yes"; }

            if ($callow != "yes") { return 403; }
            error_page 403 = @forbidden_page;

            # El BFF expone /api/* (no /containers/api/*). Strip prefix /containers.
            rewrite ^/containers/(.*) /$1 break;

            # SSE necesita disable buffering + read_timeout largo
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;

            proxy_pass         http://containers_dashboard_bff_upstream;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Real-IP               $remote_addr;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       $scheme;
            proxy_set_header   X-Auth-Request-User     $user;
            proxy_set_header   X-Auth-Request-Groups   $groups;
            proxy_set_header   X-Original-URI          $request_uri;
        }
    }
}
