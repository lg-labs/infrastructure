# BackOffice gateway — nginx
#
# Pipeline por upstream:
#   1. auth_request → oauth2-proxy /oauth2/auth (verifica autenticación)
#       - 401 → error_page 401 → @redirect_to_login
#       - 2xx → continúa
#   2. nginx setea $groups con la cabecera X-Auth-Request-Groups
#   3. error_page 403 + try_files trick para chequear grupos en fase content
#       - usamos un location @ con `if` (que aquí sí ve $groups)

worker_processes 1;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    # WebSocket upgrade map (Kibana, Portainer)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream oauth2_proxy { server oauth2-proxy:4180; }
    upstream akhq_upstream      { server akhq:8080; }
    upstream kibana_upstream    { server kibana:5601; }
    upstream portainer_upstream { server portainer:9000; }
    upstream keycloak_upstream  { server keycloak:8080; }

    # Server interno con stubs y endpoint /me
    server {
        listen 8081;
        server_name _;
        default_type text/plain;

        location = /stub/akhq      { return 200 'STUB /akhq/ — autorizado.\n'; }
        location = /stub/portainer { return 200 'STUB /portainer/ — autorizado.\n'; }
        location = /stub/kibana    { return 200 'STUB /kibana/ — autorizado.\n'; }
        location = /stub/keycloak  { return 200 'STUB /keycloak/ — solo admin.\n'; }

        location = /stub/me {
            default_type application/json;
            return 200 '{"user":"$http_x_auth_user","email":"$http_x_auth_email","groups":"$http_x_auth_groups"}';
        }
    }

    # Server público :80
    server {
        listen 80;
        server_name _;

        # ---- oauth2-proxy passthrough ----
        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host                    $http_host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Scheme                $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass       http://oauth2_proxy;
            proxy_set_header Host             $http_host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Original-URI   $request_uri;
            proxy_set_header Authorization    $http_authorization;
            proxy_pass_request_body           off;
            proxy_set_header Content-Length   "";
        }

        # ---- handlers de error globales ----
        error_page 401 = @redirect_to_login;
        location @redirect_to_login {
            return 302 $scheme://$http_host/oauth2/sign_in?rd=$scheme://$http_host$request_uri;
        }

        # ---- 403 page ----
        location @forbidden_page {
            internal;
            default_type text/html;
            return 403 '<!doctype html><html><body style="font-family:sans-serif"><h1>403 — Acceso denegado</h1><p>Tu rol no tiene acceso a este recurso.</p><p><a href="/">← Volver al BackOffice</a></p></body></html>';
        }

        # ---- landing ----
        location = / {
            auth_request /oauth2/auth;
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # ---- /me ----
        location = /me {
            auth_request     /oauth2/auth;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            auth_request_set $email  $upstream_http_x_auth_request_email;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            proxy_set_header X-Auth-User   $user;
            proxy_set_header X-Auth-Email  $email;
            proxy_set_header X-Auth-Groups $groups;
            proxy_pass http://127.0.0.1:8081/stub/me;
        }

        # ---- upstreams protegidos ----
        # Patrón: auth_request primero (autenticación), luego try_files al
        # location @check_X que evalúa el grupo. Como try_files está en fase
        # content (post-access), $groups SÍ tiene el valor inyectado por
        # auth_request_set.

        location /akhq/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            auth_request_set $user   $upstream_http_x_auth_request_user;
            try_files /__nonexistent__ @do_akhq;
        }
        location @do_akhq {
            internal;
            if ($groups !~ "(^|,)(admin|operator)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            proxy_pass         http://akhq_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Auth-User       $user;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        location /portainer/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_portainer;
        }
        location @do_portainer {
            internal;
            if ($groups !~ "(^|,)(admin|operator)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            # Portainer no soporta basePath nativo: stripeamos /portainer/ y dejamos al user nav en /
            rewrite ^/portainer/(.*) /$1 break;
            proxy_pass         http://portainer_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }

        location /kibana/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_kibana;
        }
        location @do_kibana {
            internal;
            if ($groups !~ "(^|,)(admin|operator|support|viewer)(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            proxy_pass         http://kibana_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location /keycloak/ {
            auth_request     /oauth2/auth;
            auth_request_set $groups $upstream_http_x_auth_request_groups;
            try_files /__nonexistent__ @do_keycloak;
        }
        location @do_keycloak {
            internal;
            if ($groups !~ "(^|,)admin(,|$)") { return 403; }
            error_page 403 = @forbidden_page;
            # Keycloak Admin Console requiere conocer su path. Le pasamos el prefijo via Host/Forwarded
            proxy_pass         http://keycloak_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Prefix /keycloak;
        }
    }
}
