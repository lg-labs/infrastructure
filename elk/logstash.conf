input {
 beats {
    port=> "5044"
 }
 file {
   # https://www.elastic.co/guide/en/logstash/current/plugins-inputs-file.html
   #default is TAIL which assumes more data will come into the file.
   #change to mode => "read" if the file is a complete file.  by default, the file will be removed once reading is complete -- backup your files if you need them.
   mode => "tail"
   path => "/usr/share/logstash/ingest_data/*"
 }
}


filter {
}


output {
 # BackOffice audit (oauth2-proxy access logs) → índice dedicado
 if "backoffice-audit" in [tags] {
   elasticsearch {
     index => "backoffice-audit-%{+YYYY.MM.dd}"
     hosts=> "${ELASTIC_HOSTS}"
     user=> "${ELASTIC_USER}"
     password=> "${ELASTIC_PASSWORD}"
     ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
   }
 } else {
   elasticsearch {
     index => "logstash-%{+YYYY.MM.dd}"
     hosts=> "${ELASTIC_HOSTS}"
     user=> "${ELASTIC_USER}"
     password=> "${ELASTIC_PASSWORD}"
     ssl_certificate_authorities => "/usr/share/logstash/certs/ca/ca.crt"
   }
 }
}