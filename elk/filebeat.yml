filebeat.inputs:
  - type: filestream
    enabled: true
    id: default-filestream
    paths:
      - ingest_data/*.log
    take_over:
      enabled: true
    json.keys_under_root: true

    processors:
      - decode_json_fields:
          fields: [ 'message' ]
          target: json

  # BackOffice audit log (oauth2-proxy)
  # El proxy escribe JSON line-delimited en /var/log/proxy/oauth2-proxy.log
  # (volumen compartido `backoffice-audit-logs`).
  - type: filestream
    enabled: true
    id: backoffice-audit
    paths:
      - /var/log/backoffice/*.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    fields:
      source: backoffice-audit
    fields_under_root: true
    tags: [ "backoffice-audit" ]

output.logstash:
  hosts: [ "${HOSTS}" ]
